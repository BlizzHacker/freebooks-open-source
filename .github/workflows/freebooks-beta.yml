name: FreeBooks alpha build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/beta/**"
      - "clients/desktop/**"
      - "freebooks/release/**"
      - "packages/**"
      - "shared/**"
      - ".github/workflows/freebooks-beta.yml"
permissions:
  contents: read
concurrency:
  group: freebooks-alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - name: Check export boundaries
        run: |
          python3 freebooks/release/test-source-archive.py
          python3 -m unittest discover -s deploy/beta -p test_manage.py
      - name: Export source without deployment state
        run: |
          python3 freebooks/release/make-source-archive.py --output "${{ runner.temp }}/freebooks-alpha"
          python3 freebooks/release/verify-source-archive.py "${{ runner.temp }}/freebooks-alpha"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebooks-alpha-source
          path: |
            ${{ runner.temp }}/freebooks-alpha/freebooks-alpha-source.tar.gz
            ${{ runner.temp }}/freebooks-alpha/source-manifest.json
            ${{ runner.temp }}/freebooks-alpha/source-audit.json
            ${{ runner.temp }}/freebooks-alpha/SHA256SUMS
          if-no-files-found: error
  self-host-smoke:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: freebooks-alpha-source
          path: ${{ runner.temp }}/source-artifact
      - name: Extract audited source
        run: tar -xzf "${{ runner.temp }}/source-artifact/freebooks-alpha-source.tar.gz" -C "${{ runner.temp }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - name: Build and start isolated installation
        working-directory: ${{ runner.temp }}/freebooks-alpha
        run: |
          python3 deploy/beta/manage.py init --project freebooks-ci
          python3 deploy/beta/manage.py start --build
          python3 deploy/beta/manage.py check
      - name: Exercise owner, organization and document flows
        working-directory: ${{ runner.temp }}/freebooks-alpha
        run: python3 deploy/beta/smoke.py --backup-roundtrip
      - name: Stop disposable stack
        if: always()
        working-directory: ${{ runner.temp }}/freebooks-alpha
        run: docker compose --env-file deploy/beta/.env -f deploy/beta/compose.yaml down -v --remove-orphans
  desktop:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: windows-latest, platform: win }
          - { os: macos-latest, platform: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: freebooks-alpha-source
          path: ${{ runner.temp }}/source-artifact
      - name: Extract audited source
        shell: bash
        run: tar -xzf "${{ runner.temp }}/source-artifact/freebooks-alpha-source.tar.gz" -C "${{ runner.temp }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24" }
      - name: Install and test desktop client
        working-directory: ${{ runner.temp }}/freebooks-alpha/clients/desktop
        run: |
          npm ci
          npm test
      - name: Build unsigned alpha package
        working-directory: ${{ runner.temp }}/freebooks-alpha/clients/desktop
        env:
          FREEBOOKS_BUNDLE_DIR: ${{ runner.temp }}/freebooks-alpha
          FREEBOOKS_DESKTOP_OUTPUT: ${{ runner.temp }}/desktop-artifacts
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebooks-alpha-desktop-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/desktop-artifacts/*.zip
            ${{ runner.temp }}/desktop-artifacts/*.tar.gz
            ${{ runner.temp }}/desktop-artifacts/*.dmg
          if-no-files-found: error
